---
- name: Install t3 into the user's npm prefix
  community.general.npm:
    name: t3
    version: "{{ t3code_version }}"
    global: true
    state: present
  become: true
  become_user: "{{ t3code_user }}"
  environment:
    NPM_CONFIG_PREFIX: "{{ t3code_npm_prefix }}"
  notify: Restart t3code

- name: Verify node-pty native module built
  ansible.builtin.stat:
    path: "{{ t3code_npm_prefix }}/lib/node_modules/t3/node_modules/node-pty/build/Release/pty.node"
  register: t3code_pty_node
  failed_when: not t3code_pty_node.stat.exists

- name: Expose t3 on the system PATH
  ansible.builtin.file:
    src: "{{ t3code_npm_prefix }}/bin/t3"
    dest: /usr/local/bin/t3
    state: link
    force: true

# Transitional: earlier setup used a user-scope unit + linger. Remove it so the system unit owns the port.
- name: Check for legacy user unit
  ansible.builtin.stat:
    path: "{{ t3code_home }}/.config/systemd/user/t3code.service"
  register: t3code_legacy_unit

- name: Remove legacy user unit
  when: t3code_legacy_unit.stat.exists
  block:
    - name: Stop and disable legacy user unit
      ansible.builtin.systemd_service:
        name: t3code
        scope: user
        state: stopped
        enabled: false
      become: true
      become_user: "{{ t3code_user }}"
      failed_when: false

    - name: Delete legacy user unit file
      ansible.builtin.file:
        path: "{{ t3code_home }}/.config/systemd/user/t3code.service"
        state: absent

    - name: Disable lingering
      ansible.builtin.command: "loginctl disable-linger {{ t3code_user }}"
      changed_when: true

- name: Install t3code system unit
  ansible.builtin.template:
    src: t3code.service.j2
    dest: /etc/systemd/system/t3code.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart t3code

- name: Enable and start t3code
  ansible.builtin.systemd_service:
    name: t3code
    daemon_reload: true
    enabled: true
    state: started

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Read tailnet DNS name
  ansible.builtin.command: tailscale status --json
  register: t3code_ts_status
  changed_when: false

- name: Set tailnet URL
  ansible.builtin.set_fact:
    t3code_url: "https://{{ (t3code_ts_status.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"

- name: Wait for t3 over Tailscale Serve (cert provisioning can take a bit on first run)
  ansible.builtin.uri:
    url: "{{ t3code_url }}/.well-known/t3/environment"
    status_code: 200
  register: t3code_probe
  until: t3code_probe.status == 200
  retries: 12
  delay: 5
  become: false

- name: Show connection info
  ansible.builtin.debug:
    msg:
      - "t3 is up at {{ t3code_url }}"
      - "Pair a client: ssh {{ t3code_user }}@{{ ansible_host }} 't3 pair --tailscale'"

---
- name: Add NodeSource apt repo
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow npm install scripts for native deps
  ansible.builtin.lineinfile:
    path: "/home/{{ node_npm_user }}/.npmrc"
    regexp: "^allow-scripts="
    line: "allow-scripts=msgpackr-extract,node-pty"
    create: true
    owner: "{{ node_npm_user }}"
    group: "{{ node_npm_user }}"
    mode: "0644"

---
- name: Add NodeSource apt repo
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
  register: node_repo

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: "{{ node_repo.changed }}"

- name: Allow npm install scripts for native deps (node-pty needs a build step)
  ansible.builtin.lineinfile:
    path: "/home/{{ t3_user }}/.npmrc"
    regexp: "^allow-scripts="
    line: "allow-scripts=msgpackr-extract,node-pty"
    create: true
    owner: "{{ t3_user }}"
    group: "{{ t3_user }}"
    mode: "0644"

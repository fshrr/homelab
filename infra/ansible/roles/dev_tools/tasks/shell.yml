---
- name: Clone zinit
  ansible.builtin.git:
    repo: https://github.com/zdharma-continuum/zinit.git
    dest: "{{ dev_tools_home }}/.local/share/zinit/zinit.git"
    version: "{{ dev_tools_zinit_version }}"
    depth: 1
  become: true
  become_user: "{{ dev_tools_user }}"

- name: Dotfiles
  when: dev_tools_dotfiles_profile != 'skip'
  become: true
  become_user: "{{ dev_tools_user }}"
  block:
    - name: Clone or update dotfiles
      ansible.builtin.git:
        repo: "{{ dev_tools_dotfiles_repo }}"
        dest: "{{ dev_tools_home }}/.dotfiles"
        version: main
        # .gitmodules lists tmux/omt but the repo has no gitlink for it; recursive
        # update would report changed on every run.
        recursive: false
      register: dev_tools_dotfiles

    - name: Check whether dotfiles are stowed
      ansible.builtin.stat:
        path: "{{ dev_tools_home }}/.zshenv"
      register: dev_tools_zshenv

    - name: Stow dotfiles profile
      ansible.builtin.command: "./install.sh {{ dev_tools_dotfiles_profile }}"
      args:
        chdir: "{{ dev_tools_home }}/.dotfiles"
      register: dev_tools_stow
      changed_when: "'Stowing' in dev_tools_stow.stdout"
      when: dev_tools_dotfiles.changed or not dev_tools_zshenv.stat.exists

- name: Set login shell
  ansible.builtin.user:
    name: "{{ dev_tools_user }}"
    shell: "{{ dev_tools_shell }}"

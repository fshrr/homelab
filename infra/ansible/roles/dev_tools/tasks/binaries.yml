---
- name: Download uv tarball
  ansible.builtin.get_url:
    url: "https://github.com/astral-sh/uv/releases/download/{{ dev_tools_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
    dest: "/usr/local/src/uv-{{ dev_tools_uv_version }}.tar.gz"
    checksum: "{{ dev_tools_uv_sha256 }}"
    mode: "0644"

- name: Install uv and uvx
  ansible.builtin.unarchive:
    src: "/usr/local/src/uv-{{ dev_tools_uv_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1"]
    include: ["uv-x86_64-unknown-linux-gnu/uv", "uv-x86_64-unknown-linux-gnu/uvx"]
    owner: root
    group: root
    mode: "0755"
    creates: /usr/local/bin/uv

- name: Download ast-grep zip
  ansible.builtin.get_url:
    url: "https://github.com/ast-grep/ast-grep/releases/download/{{ dev_tools_ast_grep_version }}/app-x86_64-unknown-linux-gnu.zip"
    dest: "/usr/local/src/ast-grep-{{ dev_tools_ast_grep_version }}.zip"
    checksum: "{{ dev_tools_ast_grep_sha256 }}"
    mode: "0644"

# The zip also ships an `sg` alias, deliberately skipped: /usr/local/bin/sg would
# shadow the setgid `sg` from shadow-utils.
- name: Install ast-grep
  ansible.builtin.unarchive:
    src: "/usr/local/src/ast-grep-{{ dev_tools_ast_grep_version }}.zip"
    dest: /usr/local/bin
    remote_src: true
    include: ["ast-grep"]
    owner: root
    group: root
    mode: "0755"
    creates: /usr/local/bin/ast-grep

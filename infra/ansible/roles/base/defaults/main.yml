---
base_timezone: "{{ timezone | default('UTC') }}"

# Packages the Debian golden-image script installed, minus Debian-only bits.
# lazygit is in Ubuntu apt; yazi/lazydocker come from GitHub releases in dev_tools/docker.
# Security packages (ufw, fail2ban, unattended-upgrades) live in the firewall/hardening roles.
base_packages:
  - build-essential
  - python3
  - curl
  - ca-certificates
  - gnupg
  - lsb-release
  - apt-transport-https
  - git
  - git-delta
  - zip
  - unzip
  - 7zip
  - btop
  - ncdu
  - net-tools
  - ethtool
  - apache2-utils
  - speedtest-cli
  - iozone3
  - neovim
  - zsh
  - tmux
  - fzf
  - zoxide
  - eza
  - fd-find
  - ripgrep
  - jq
  - tre-command
  - stow
  - nfs-common
  - ffmpeg
  - imagemagick
  - poppler-utils
  - lazygit
  - chrony
  - cloud-init
  - cloud-guest-utils
  - qemu-guest-agent

# Distro docker packages that conflict with docker-ce.
base_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-doc
  - podman-docker
  - containerd
  - runc

base_sysctl_tuning:
  vm.swappiness: 10
  vm.vfs_cache_pressure: 50
  fs.inotify.max_user_watches: 262144
